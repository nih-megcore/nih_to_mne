name: nih2mne-tests
on: [push]
jobs:
  Pytest:
    name: InstallAndTest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11"]
        mne-version: ["1.10"]
        qt-api: ["pyqt6", "pyqt5"]
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - uses: actions/checkout@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict
          python-version: ${{ matrix.python-version }}
      - name: Install MNE
        shell: bash -el {0}
        run: $CONDA/bin/conda install --name test --strict-channel-priority --override-channels --channel=conda-forge 'python=${{ matrix.python-version }}' pytest 'mne=${{ matrix.mne-version }}'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes git libegl1
      - name: Install checked-out nih2mne
        shell: bash -el {0}
        run: $CONDA/envs/test/bin/pip install .
      - name: Install PyQt5 compatibility binding
        if: matrix.qt-api == 'pyqt5'
        shell: bash -el {0}
        run: $CONDA/envs/test/bin/pip install 'PyQt5>=5.15'
      - name: Download test data
        shell: bash -el {0}
        run: make get_data
      - name: Pytest
        shell: bash -el {0}
        env:
          QT_API: ${{ matrix.qt-api }}
          QT_QPA_PLATFORM: offscreen
        run: $CONDA/envs/test/bin/pytest
  
